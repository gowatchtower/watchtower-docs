# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json

version: "2"

run:
  timeout: 5m
  allow-parallel-runners: true
  allow-serial-runners: true

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/gowatchtower/tplprev)
        - blank
        - dot
        - alias
        - localmodule
    gofmt:
      rewrite-rules:
        - pattern: "interface{}"
          replacement: any
    gofumpt:
      module-path: github.com/gowatchtower/tplprev
      extra-rules: true
    golines:
      max-len: 200
      tab-len: 4
      shorten-comments: true
      reformat-tags: true
      chain-split-dots: true

linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - containedctx
    - copyloopvar
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funcorder
    - gocheckcompilerdirectives
    - gocritic
    - godot
    - godoclint
    - godox
    - gomoddirectives
    - goprintffuncname
    - gosec
    - govet
    - grouper
    - inamedparam
    - ineffassign
    - intrange
    - iotamixing
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noinlineerr
    - nonamedreturns
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - recvcheck
    - revive
    - staticcheck
    - tagalign
    - testableexamples
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
  settings:
    revive:
      enable-all-rules: false
      rules:
        - name: var-naming
          severity: warning
          disabled: false
          arguments:
            - []
            - []
            - - skip-initialism-name-checks: false
                upper-case-const: true
                skip-package-name-checks: true
                skip-package-name-collision-with-go-std: true
        - name: package-comments
          severity: warning
          disabled: false
    testifylint:
      enable-all: true
    varnamelen:
      max-distance: 5
      min-name-length: 3
      check-return: true
      check-type-param: true
      ignore-type-assert-ok: true
      ignore-map-index-ok: true
      ignore-chan-recv-ok: true
      ignore-names:
        - err
        - b
        - c
        - ctx
        - i
        - tt
        - ok
      ignore-decls:
        - t testing.T
        - e error
        - i int
        - T any
  exclusions:
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    rules:
      - path: _test\.go
        linters:
          - dupl
          - err113
          - errcheck
          - errorlint
          - exhaustive
          - forcetypeassert
          - gosec
          - usetesting
          - wrapcheck
          - varnamelen
    warn-unused: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  whole-files: true

output:
  formats:
    text:
      print-linter-name: true
      print-issued-lines: true
      colors: true
  sort-order:
    - linter
    - severity
    - file

# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  HUGO: hugo
  GO: go
  TPLPREV_DIR: tools/tplprev
  TPLPREV_TIMEOUT: 60s

tasks:
  default:
    - task: serve

  setup:
    desc: Fetch Hugo Modules (Hextra theme)
    cmds:
      - "{{.HUGO}} mod get"
    preconditions:
      - sh: command -v hugo
        msg: Hugo Extended v0.146+ must be installed

  serve:
    desc: Serve the docs site locally (http://localhost:1313/)
    aliases: [dev, docs]
    cmds:
      - task: setup
      - task: tplprev:build
      - "{{.HUGO}} server --buildDrafts --disableFastRender"
    preconditions:
      - sh: command -v hugo
        msg: Hugo Extended v0.146+ must be installed

  build:
    desc: Build the site without versions into public/
    cmds:
      - task: setup
      - task: tplprev:build
      - "{{.HUGO}} --gc --minify"
    preconditions:
      - sh: command -v hugo
        msg: Hugo Extended v0.146+ must be installed

  preview:build:
    desc: Assemble a local preview of the published site, with this checkout as nightly, into public/
    cmds:
      - task: tplprev:build
      - ./scripts/build-preview.sh
    preconditions:
      - sh: command -v hugo
        msg: Hugo Extended v0.146+ must be installed

  preview:serve:
    desc: Serve the assembled preview (http://localhost:1314/)
    cmds:
      - python3 -m http.server 1314 --directory public
    preconditions:
      - sh: test -f public/versions.json
        msg: Run task preview:build first

  check:
    desc: Verify the site build and tplprev module
    cmds:
      - task: build
      - task: tplprev:test
      - task: tplprev:vet
      - task: tplprev:lint

  clean:
    desc: Remove Hugo build artifacts
    cmds:
      - rm -rf public/ resources/ _vendor/ .hugo_build.lock

  test:
    desc: Run tplprev tests
    cmds:
      - task: tplprev:test

  vet:
    desc: Run go vet on tplprev
    cmds:
      - task: tplprev:vet

  lint:
    desc: Lint tplprev
    cmds:
      - task: tplprev:lint

  tplprev:test:
    desc: Run tplprev module tests
    cmds:
      - "{{.GO}} -C {{.TPLPREV_DIR}} test -timeout {{.TPLPREV_TIMEOUT}} ./..."
    preconditions:
      - sh: command -v go
        msg: Go must be installed

  tplprev:vet:
    desc: Run go vet on the tplprev module
    cmds:
      - "{{.GO}} -C {{.TPLPREV_DIR}} vet ./..."
    preconditions:
      - sh: command -v go
        msg: Go must be installed

  tplprev:lint:
    desc: Lint the tplprev module
    cmds:
      - golangci-lint run --timeout {{.TPLPREV_TIMEOUT}} ./...
    dir: "{{.TPLPREV_DIR}}"
    preconditions:
      - sh: command -v golangci-lint
        msg: golangci-lint must be installed

  tplprev:fmt:
    desc: Format the tplprev module
    cmds:
      - "{{.GO}} -C {{.TPLPREV_DIR}} fmt ./..."
    preconditions:
      - sh: command -v go
        msg: Go must be installed

  tplprev:build:
    desc: Build the template preview WASM into static/ for local use
    aliases: [wasm]
    cmds:
      - ./scripts/build-tplprev.sh

  tplprev:tidy:
    desc: Tidy the tplprev Go module
    cmds:
      - "{{.GO}} -C {{.TPLPREV_DIR}} mod tidy"
    preconditions:
      - sh: command -v go
        msg: Go must be installed

  mod-tidy:
    desc: Tidy Hugo and tplprev Go modules
    cmds:
      - "{{.GO}} mod tidy"
      - task: tplprev:tidy
    preconditions:
      - sh: command -v go
        msg: Go must be installed

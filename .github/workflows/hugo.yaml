---
name: Build and Publish Site

# Pull requests build the site as a check. A push to main publishes it to the
# cf-pages branch as nightly, and a push of a v* tag publishes it as that
# version. The cf-pages branch holds the published multi-version site.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - archetypes/**
      - assets/**
      - content/**
      - i18n/**
      - layouts/**
      - static/**
      - .github/actions/**
      - hugo.yaml
      - go.mod
      - go.sum
      - .github/workflows/hugo.yaml

permissions:
  contents: read

# Pull request builds run side by side. Publishes run one at a time.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'publish-cf-pages' }}
  cancel-in-progress: false

jobs:
  hugo:
    name: Build Site
    runs-on: ubuntu-latest
    permissions:
      contents: write # Pushes the built site to cf-pages.
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
    steps:
      - name: Harden the Runner (Step Security)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: go.mod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.170.1"
          extended: true

      - name: Build Site
        id: build
        uses: ./.github/actions/build-versioned-docs # zizmor: ignore[self-repository]
        with:
          version: ${{ env.VERSION }}
          base-url: https://gowatchtower.org

      - name: Publish Site
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: ./.github/actions/publish-versioned-docs # zizmor: ignore[self-repository]
        with:
          path: ${{ steps.build.outputs.path }}
          version: ${{ env.VERSION }}
